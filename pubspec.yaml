name: notenest
description: A private, offline-first notes app built with Flutter and Drift.
publish_to: "none"
version: 2.0.12+2012

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  drift: 2.34.3
  drift_flutter: 0.3.1
  file_picker: 11.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  local_auth: 3.0.2
  path: 1.9.1
  shared_preferences: 2.5.5
  url_launcher: 6.3.2
  uuid: 4.6.0

dev_dependencies:
  build_runner: 2.16.0
  drift_dev: 2.34.5
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
