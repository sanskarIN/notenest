name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          python3 --version

      - name: Verify version synchronization
        run: python3 tool/check_version_sync.py

      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Run repository policy checks
        run: python3 tool/check_repo.py

      - name: Check repository reference coverage
        run: python3 tool/check_repository_reference.py

      - name: Check Markdown links
        run: python3 tool/check_markdown_links.py

      - name: Run lightweight secret scan
        run: python3 tool/security_scan.py

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
