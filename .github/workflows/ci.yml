name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          python3 --version

      - name: Verify version synchronization
        run: python3 tool/check_version_sync.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: resolved-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 14

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Materialize final verification tree
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.ref == 'verify/2.0.12-final' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          dart format lib test
          git config user.name "sanskarIN"
          git config user.email "sanskarin@outlook.in"
          git add -f pubspec.lock
          git add lib test
          if git diff --cached --quiet; then
            echo "Verification branch already contains the generated lockfile and pinned formatting."
            exit 0
          fi
          git commit -m "build: materialize 2.0.12 dependency and format baseline"
          git push origin HEAD:verify/2.0.12-final

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Run repository policy checks
        run: python3 tool/check_repo.py

      - name: Check repository reference coverage
        run: python3 tool/check_repository_reference.py

      - name: Check Markdown links
        run: python3 tool/check_markdown_links.py

      - name: Run lightweight secret scan
        run: python3 tool/security_scan.py

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
