name: Platform builds

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".flutter-version"
      - "build.yaml"
      - "tool/bootstrap_platforms.py"
      - ".github/workflows/platform-builds.yml"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".flutter-version"
      - "build.yaml"
      - "tool/bootstrap_platforms.py"
      - ".github/workflows/platform-builds.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android release compile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Generate platform runners
        run: python tool/bootstrap_platforms.py
      - name: Resolve packages
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build release APK
        run: flutter build apk --release

  linux:
    name: Linux release compile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Generate platform runners
        run: python tool/bootstrap_platforms.py
      - name: Resolve packages
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build Linux release
        run: flutter build linux --release

  windows:
    name: Windows release compile
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Generate platform runners
        run: python tool/bootstrap_platforms.py
      - name: Resolve packages
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build Windows release
        run: flutter build windows --release

  apple:
    name: macOS and iOS compile
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true
      - name: Generate platform runners
        run: python tool/bootstrap_platforms.py
      - name: Resolve packages
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Build macOS release
        run: flutter build macos --release
      - name: Compile iOS without code signing
        run: flutter build ios --release --no-codesign
