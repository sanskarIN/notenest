name: Bug report
description: Report a reproducible NoteNest defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve NoteNest. Do not include private note content, real backups, credentials, signing keys, or security-vulnerability details here. Use SECURITY.md for vulnerabilities.

  - type: input
    id: version
    attributes:
      label: NoteNest version or commit
      description: Release version or commit SHA where the problem occurs.
      placeholder: v2.0.12 or abc1234
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS / iPadOS
        - Windows
        - macOS
        - Linux
        - Web
        - Other / setup only
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Platform / browser details
      description: For Web include browser name/version and hosting origin if relevant; for native include OS/device version.
      placeholder: Chrome 140 on Windows 11, or Android 16 on Pixel
    validations:
      required: true

  - type: input
    id: flutter
    attributes:
      label: Flutter version
      description: Paste the version line from `flutter --version` when reporting a development/build issue; use N/A for a published Web/runtime report without a local Flutter SDK.
      placeholder: Flutter 3.44.7 • channel stable
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use fictional/minimal data whenever note content is relevant.
      placeholder: |
        1. Open ...
        2. Create a fictional note ...
        3. Tap ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Include only the smallest useful error section. Redact private paths, note text, tokens, account data, browser storage contents, and private origins.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots are helpful only when they do not expose private information.

  - type: checkboxes
    id: checks
    attributes:
      label: Safety and duplication checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed private note content, credentials, and other sensitive information from this report.
          required: true
        - label: This is not an unpatched security vulnerability.
          required: true
